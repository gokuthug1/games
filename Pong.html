<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Pong Duel — GokuGames</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #131b2e;
            --border: #2a374f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-rose: #f43f5e;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Top Hub Bar */
        .hub-bar {
            width: 100%;
            height: 48px;
            background: rgba(19, 27, 46, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .hub-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
        }

        .hub-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hub {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-hub:hover {
            background: #2a374f;
            border-color: var(--accent-cyan);
            color: #fff;
        }

        /* Main Game Arena */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            gap: 14px;
            width: 100%;
            max-width: 1160px;
        }

        .controls-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .score-board {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .score-num {
            font-family: monospace;
            font-size: 28px;
            font-weight: 800;
        }

        .score-p1 { color: var(--accent-cyan); }
        .score-p2 { color: var(--accent-rose); }

        .mode-toggle {
            display: flex;
            gap: 6px;
        }

        .btn-mode {
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-mode.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Canvas Box */
        .canvas-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #050811;
            border: 2px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.08);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 50;
            text-align: center;
            padding: 24px;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .btn-start {
            background: var(--accent-cyan);
            color: #0b0f19;
            font-size: 15px;
            font-weight: 800;
            padding: 12px 32px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        .icon-svg {
            width: 16px;
            height: 16px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Hub Bar -->
    <header class="hub-bar">
        <div class="hub-title">
            <svg class="icon-svg" style="stroke: #38bdf8; fill: none; stroke-width: 2;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="2" x2="12" y2="22"></line>
            </svg>
            <span>CYBER PONG DUEL</span>
        </div>
        <div class="hub-actions">
            <button class="btn-hub" id="btn-sound" title="Toggle Audio">
                <svg class="icon-svg" id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="toggleHubFullscreen()" title="Fullscreen">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="returnToHub()" title="Return to Arcade Hub">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>HUB</span>
            </button>
        </div>
    </header>

    <!-- Game Layout -->
    <main class="game-layout">
        
        <div class="controls-panel">
            <div class="score-board">
                <div class="score-box">
                    <span class="score-label" id="p1-label">PLAYER 1</span>
                    <span class="score-num score-p1" id="p1-score">0</span>
                </div>
                <span style="font-size: 20px; font-weight: 800; color: #475569;">:</span>
                <div class="score-box">
                    <span class="score-label" id="p2-label">CYBER AI</span>
                    <span class="score-num score-p2" id="p2-score">0</span>
                </div>
            </div>

            <div class="mode-toggle">
                <button class="btn-mode active" id="btn-mode-ai" onclick="setMode('ai')">Vs AI</button>
                <button class="btn-mode" id="btn-mode-2p" onclick="setMode('2p')">2 Players</button>
            </div>
        </div>

        <div class="canvas-box">
            <canvas id="pong-canvas" width="800" height="450"></canvas>
            
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">CYBER PONG</h2>
                <p id="overlay-desc">Control with W/S or Mouse/Touch. First to 7 wins.</p>
                <button class="btn-start" id="btn-start" onclick="startGame()">SERVE BALL</button>
            </div>
        </div>

    </main>

    <script>
        /* Hub Navigation Protocol */
        function returnToHub() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeGame' }, '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        function toggleHubFullscreen() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'toggleFullscreen' }, '*');
            } else {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        /* Procedural Web Audio Engine */
        const Sound = (() => {
            let ctx = null;
            let enabled = true;

            const init = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
            };

            const tone = (freq, duration, type = 'sine', vol = 0.1) => {
                if (!enabled) return;
                init();
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            return {
                toggle: () => {
                    enabled = !enabled;
                    return enabled;
                },
                hit: (rally) => {
                    const baseFreq = 300 + Math.min(rally * 30, 600);
                    tone(baseFreq, 0.06, 'triangle', 0.15);
                },
                wall: () => tone(220, 0.04, 'sine', 0.1),
                score: () => {
                    tone(523, 0.1, 'square', 0.2);
                    setTimeout(() => tone(659, 0.2, 'square', 0.2), 100);
                }
            };
        })();

        document.getElementById('btn-sound').addEventListener('click', () => {
            const active = Sound.toggle();
            const icon = document.getElementById('sound-icon');
            if (active) {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            }
        });

        /* Game Variables */
        const canvas = document.getElementById('pong-canvas');
        const ctx = canvas.getContext('2d');
        const p1ScoreEl = document.getElementById('p1-score');
        const p2ScoreEl = document.getElementById('p2-score');
        const p2LabelEl = document.getElementById('p2-label');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const btnStart = document.getElementById('btn-start');

        const WIDTH = 960;
        const HEIGHT = 540;
        let dpr = 1;
        let screenShake = 0;
        let floatingTexts = [];

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(WIDTH * dpr);
            canvas.height = Math.round(HEIGHT * dpr);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            draw();
        });
        resizeCanvas();

        let mode = 'ai'; // 'ai' or '2p'
        let p1Score = 0;
        let p2Score = 0;
        let rallyCount = 0;
        let isRunning = false;

        const PADDLE_W = 14;
        const PADDLE_H = 92;

        const p1 = {
            x: 28,
            y: (HEIGHT - PADDLE_H) / 2,
            vy: 0,
            speed: 8.5
        };

        const p2 = {
            x: WIDTH - 28 - PADDLE_W,
            y: (HEIGHT - PADDLE_H) / 2,
            vy: 0,
            speed: 7.6
        };

        const ball = {
            x: WIDTH / 2,
            y: HEIGHT / 2,
            radius: 8,
            vx: 6,
            vy: 3.5,
            speed: 7,
            trail: []
        };

        let particles = [];
        const keys = {};

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, life: 1.0, decay: 0.025 });
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btn-mode-ai').classList.toggle('active', mode === 'ai');
            document.getElementById('btn-mode-2p').classList.toggle('active', mode === '2p');
            p2LabelEl.textContent = mode === 'ai' ? 'CYBER AI' : 'PLAYER 2';
            resetGame();
        }

        function resetBall(servingTo) {
            ball.x = WIDTH / 2;
            ball.y = HEIGHT / 2;
            ball.speed = 7;
            ball.trail = [];
            rallyCount = 0;
            const angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
            const dir = servingTo === 1 ? -1 : 1;
            ball.vx = Math.cos(angle) * ball.speed * dir;
            ball.vy = Math.sin(angle) * ball.speed;
        }

        function spawnSparks(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color
                });
            }
        }

        function update() {
            if (!isRunning) return;

            // Player 1 Input
            if (keys['KeyW'] || keys['ArrowUp']) p1.y -= p1.speed;
            if (keys['KeyS'] || keys['ArrowDown']) p1.y += p1.speed;

            // Player 2 Input or AI
            if (mode === '2p') {
                if (keys['KeyI'] || keys['Numpad8']) p2.y -= p2.speed;
                if (keys['KeyK'] || keys['Numpad2']) p2.y += p2.speed;
            } else {
                // AI Tracking with predictive smooth lerp
                const targetY = ball.y - PADDLE_H / 2;
                const dist = targetY - p2.y;
                p2.y += Math.sign(dist) * Math.min(Math.abs(dist), p2.speed);
            }

            // Clamp Paddles
            p1.y = Math.max(8, Math.min(HEIGHT - PADDLE_H - 8, p1.y));
            p2.y = Math.max(8, Math.min(HEIGHT - PADDLE_H - 8, p2.y));

            // Record ball trail
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 8) ball.trail.shift();

            // Move Ball
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Top & Bottom Collision
            if (ball.y - ball.radius <= 6) {
                ball.y = 6 + ball.radius;
                ball.vy = -ball.vy;
                Sound.wall();
                screenShake = 3;
                spawnSparks(ball.x, 6, '#38bdf8', 10);
            } else if (ball.y + ball.radius >= HEIGHT - 6) {
                ball.y = HEIGHT - 6 - ball.radius;
                ball.vy = -ball.vy;
                Sound.wall();
                screenShake = 3;
                spawnSparks(ball.x, HEIGHT - 6, '#38bdf8', 10);
            }

            // Paddle 1 Collision
            if (ball.x - ball.radius <= p1.x + PADDLE_W && ball.x + ball.radius >= p1.x) {
                if (ball.y >= p1.y && ball.y <= p1.y + PADDLE_H) {
                    ball.x = p1.x + PADDLE_W + ball.radius;
                    rallyCount++;
                    ball.speed = Math.min(16, ball.speed + 0.45);
                    const relativeIntersectY = (p1.y + (PADDLE_H / 2)) - ball.y;
                    const normalizedRelativeIntersectionY = relativeIntersectY / (PADDLE_H / 2);
                    const bounceAngle = normalizedRelativeIntersectionY * (Math.PI / 3);
                    ball.vx = Math.cos(bounceAngle) * ball.speed;
                    ball.vy = -Math.sin(bounceAngle) * ball.speed;
                    Sound.hit(rallyCount);
                    screenShake = Math.min(8, 2 + rallyCount * 0.4);
                    spawnSparks(ball.x, ball.y, '#38bdf8', 14);
                    if (rallyCount % 5 === 0) {
                        addFloatingText(WIDTH / 2, 70, `${rallyCount}x RALLY!`, '#38bdf8');
                    }
                }
            }

            // Paddle 2 Collision
            if (ball.x + ball.radius >= p2.x && ball.x - ball.radius <= p2.x + PADDLE_W) {
                if (ball.y >= p2.y && ball.y <= p2.y + PADDLE_H) {
                    ball.x = p2.x - ball.radius;
                    rallyCount++;
                    ball.speed = Math.min(16, ball.speed + 0.45);
                    const relativeIntersectY = (p2.y + (PADDLE_H / 2)) - ball.y;
                    const normalizedRelativeIntersectionY = relativeIntersectY / (PADDLE_H / 2);
                    const bounceAngle = normalizedRelativeIntersectionY * (Math.PI / 3);
                    ball.vx = -Math.cos(bounceAngle) * ball.speed;
                    ball.vy = -Math.sin(bounceAngle) * ball.speed;
                    Sound.hit(rallyCount);
                    screenShake = Math.min(8, 2 + rallyCount * 0.4);
                    spawnSparks(ball.x, ball.y, '#f43f5e', 14);
                    if (rallyCount % 5 === 0) {
                        addFloatingText(WIDTH / 2, 70, `${rallyCount}x RALLY!`, '#f43f5e');
                    }
                }
            }

            // Scoring
            if (ball.x < 0) {
                p2Score++;
                p2ScoreEl.textContent = p2Score;
                Sound.score();
                screenShake = 12;
                spawnSparks(30, ball.y, '#f43f5e', 25);
                addFloatingText(WIDTH * 0.75, HEIGHT / 2, 'POINT!', '#f43f5e');
                checkWinner();
                resetBall(1);
            } else if (ball.x > WIDTH) {
                p1Score++;
                p1ScoreEl.textContent = p1Score;
                Sound.score();
                screenShake = 12;
                spawnSparks(WIDTH - 30, ball.y, '#38bdf8', 25);
                addFloatingText(WIDTH * 0.25, HEIGHT / 2, 'POINT!', '#38bdf8');
                checkWinner();
                resetBall(2);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function checkWinner() {
            if (p1Score >= 7 || p2Score >= 7) {
                isRunning = false;
                const p1Won = p1Score >= 7;
                screenShake = 14;
                overlayTitle.textContent = p1Won ? "PLAYER 1 WINS!" : (mode === 'ai' ? "CYBER AI WINS!" : "PLAYER 2 WINS!");
                overlayTitle.style.color = p1Won ? "#38bdf8" : "#f43f5e";
                overlayDesc.textContent = `Final Match Score: ${p1Score} - ${p2Score}`;
                btnStart.textContent = "PLAY AGAIN";
                overlay.classList.add('visible');
            }
        }

        function draw() {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.save();
            if (screenShake > 0) {
                const sx = (Math.random() - 0.5) * screenShake;
                const sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
                screenShake *= 0.85;
                if (screenShake < 0.2) screenShake = 0;
            }

            ctx.clearRect(0, 0, WIDTH, HEIGHT);

            // Court neon border glow
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.lineTo(WIDTH, 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, HEIGHT - 2);
            ctx.lineTo(WIDTH, HEIGHT - 2);
            ctx.stroke();

            // Center Net & Center Ring
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 6;
            ctx.setLineDash([10, 14]);
            ctx.beginPath();
            ctx.moveTo(WIDTH / 2, 0);
            ctx.lineTo(WIDTH / 2, HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(WIDTH / 2, HEIGHT / 2, 50, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Paddles with neon glow & bevel
            ctx.save();
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.roundRect(p1.x, p1.y, PADDLE_W, PADDLE_H, 6);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(p1.x + 3, p1.y + 4, PADDLE_W - 6, PADDLE_H - 8);
            ctx.restore();

            ctx.save();
            ctx.fillStyle = '#f43f5e';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.roundRect(p2.x, p2.y, PADDLE_W, PADDLE_H, 6);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(p2.x + 3, p2.y + 4, PADDLE_W - 6, PADDLE_H - 8);
            ctx.restore();

            // Draw Ball Comet Trail
            for (let i = 0; i < ball.trail.length; i++) {
                const pt = ball.trail[i];
                const alpha = (i + 1) / ball.trail.length * 0.45;
                const r = ball.radius * (0.3 + 0.7 * ((i + 1) / ball.trail.length));
                ctx.save();
                ctx.fillStyle = ball.vx > 0 ? `rgba(56, 189, 248, ${alpha})` : `rgba(244, 63, 94, ${alpha})`;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Ball
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = ball.vx > 0 ? '#38bdf8' : '#f43f5e';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Particles
            for (const p of particles) {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Floating Texts
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 0.9;
                ft.life -= ft.decay;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }
                ctx.save();
                ctx.globalAlpha = ft.life;
                ctx.font = 'bold 16px monospace';
                ctx.fillStyle = ft.color;
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 10;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            overlay.classList.remove('visible');
            p1Score = 0;
            p2Score = 0;
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            resetBall(1);
            isRunning = true;
        }

        function resetGame() {
            isRunning = false;
            p1Score = 0;
            p2Score = 0;
            p1ScoreEl.textContent = '0';
            p2ScoreEl.textContent = '0';
            overlay.classList.add('visible');
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // Touch / Mouse Tracking for Player 1
        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleY = HEIGHT / rect.height;
            const touchY = (e.clientY - rect.top) * scaleY;
            p1.y = touchY - PADDLE_H / 2;
        });

        overlay.classList.add('visible');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
