<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Word Matrix — GokuGames</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #131b2e;
            --border: #2a374f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-gray: #334155;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Hub Bar */
        .hub-bar {
            width: 100%;
            height: 48px;
            background: rgba(19, 27, 46, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .hub-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-green);
        }

        .hub-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hub {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-hub:hover {
            background: #2a374f;
            border-color: var(--accent-cyan);
            color: #fff;
        }

        /* Main Game Layout */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2vh, 20px) clamp(12px, 2vw, 24px);
            width: 100%;
            max-width: clamp(380px, 94vw, 680px);
        }

        /* Message Toast */
        .toast {
            position: fixed;
            top: 60px;
            background: var(--text-main);
            color: #0b0f19;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            z-index: 200;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Grid Matrix */
        .board-container {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.2vh, 12px);
            margin: auto 0;
            perspective: 800px;
        }

        .row {
            display: flex;
            gap: clamp(6px, 1.2vw, 12px);
            transition: transform 0.2s;
        }

        .row.shake {
            animation: rowShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes rowShake {
            10%, 90% { transform: translateX(-4px); }
            20%, 80% { transform: translateX(6px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        .tile {
            width: clamp(52px, 12.5vw, 76px);
            height: clamp(52px, 12.5vw, 76px);
            border: 2px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(145deg, #162035 0%, #0d1424 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 5.5vw, 36px);
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, border-color 0.15s, background-color 0.2s;
            transform-style: preserve-3d;
        }

        .tile.pop {
            transform: scale(1.14);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .tile.flip {
            animation: flipTile 0.5s ease-in-out forwards;
        }

        @keyframes flipTile {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .tile.win {
            animation: winBounce 0.6s ease-in-out;
        }

        @keyframes winBounce {
            0%, 100% { transform: translateY(0); }
            40% { transform: translateY(-24px) scale(1.06); }
            60% { transform: translateY(-8px); }
        }

        .tile.correct {
            background: linear-gradient(145deg, #10b981 0%, #059669 100%) !important;
            border-color: #34d399 !important;
            color: #fff;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tile.present {
            background: linear-gradient(145deg, #f59e0b 0%, #d97706 100%) !important;
            border-color: #fbbf24 !important;
            color: #fff;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tile.absent {
            background: linear-gradient(145deg, #253347 0%, #172030 100%) !important;
            border-color: #334155 !important;
            color: #64748b;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Virtual Keyboard */
        .keyboard {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(5px, 1vw, 8px);
            margin-bottom: 8px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: clamp(4px, 0.8vw, 6px);
        }

        .key {
            height: clamp(50px, 6.5vw, 62px);
            flex: 1;
            max-width: 56px;
            background: linear-gradient(145deg, #22314a 0%, #162033 100%);
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text-main);
            font-size: clamp(13px, 2vw, 17px);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s ease;
            touch-action: manipulation;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .key:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .key:active {
            transform: translateY(1px) scale(0.95);
        }

        .key.wide {
            flex: 1.6;
            max-width: 86px;
            font-size: clamp(11px, 1.6vw, 14px);
        }

        .key.correct {
            background: linear-gradient(145deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            color: #fff;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
        }

        .key.present {
            background: linear-gradient(145deg, #f59e0b 0%, #d97706 100%);
            border-color: #fbbf24;
            color: #fff;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
        }

        .key.absent {
            background: #0d1424;
            border-color: #1e293b;
            color: #475569;
            opacity: 0.6;
            transform: none;
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
        }

        .modal-card h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-cyan);
            font-family: monospace;
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .btn-restart {
            background: var(--accent-green);
            color: #0b0f19;
            font-size: 14px;
            font-weight: 800;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .btn-restart:hover {
            transform: scale(1.05);
        }

        .icon-svg {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        @media (max-width: 400px) {
            .tile {
                width: 46px;
                height: 46px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="hub-bar">

        <div class="hub-actions">
            <button class="btn-hub" id="btn-sound" title="Toggle Audio">

                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>

            <button class="btn-hub" onclick="toggleHubFullscreen()" title="Fullscreen">

                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="returnToHub()" title="Return to Arcade Hub">

                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>HUB</span>

    </header>

    <div class="toast" id="toast">Not in word list</div>

    <!-- Main Game Arena -->
    <main class="game-layout">
        
        <div class="board-container" id="board"></div>

        <div class="keyboard" id="keyboard">
            <div class="kb-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>

                <button class="key" data-key="A">A</button>

    </main>

    <!-- Stats & Win Modal -->
    <div class="modal" id="modal">
        <div class="modal-card">
            <h2 id="modal-title" style="color: #10b981;">VICTORY</h2>
            <p id="modal-desc">Word decrypted in 4 attempts.</p>

            <div class="stats-grid">

            <button class="btn-restart" onclick="startNewGame()">NEXT CIPHER</button>

    <script>
        /* Hub Navigation Protocol */
        function returnToHub() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeGame' }, '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        function toggleHubFullscreen() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'toggleFullscreen' }, '*');
            } else {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        /* Procedural Web Audio Engine */
        const Sound = (() => {
            let ctx = null;
            let enabled = true;

            const init = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
            };

            const tone = (freq, duration, type = 'sine', vol = 0.1) => {
                if (!enabled) return;
                init();
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            return {
                toggle: () => {
                    enabled = !enabled;
                    return enabled;
                },
                key: () => tone(440, 0.03, 'triangle', 0.08),
                del: () => tone(280, 0.04, 'sine', 0.1),
                flip: (i) => tone(300 + i * 80, 0.08, 'sine', 0.12),
                win: () => {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((f, idx) => setTimeout(() => tone(f, 0.15, 'sine', 0.15), idx * 100));
                },
                error: () => tone(150, 0.2, 'sawtooth', 0.15)
            };
        })();

        document.getElementById('btn-sound').addEventListener('click', () => {
            const active = Sound.toggle();
            const icon = document.getElementById('sound-icon');
            if (active) {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            }
        });

        /* Word Bank (Curated Tech/Cyber & Common Words) */
        const TARGET_WORDS = [

            "CRYPT", "SWIFT", "REACT", "SCALE", "CLOUD", "ARRAY", "FLOAT", "GRAPH", "PATCH", "MACRO"

            "SPEND", "SPENT", "SPLIT", "SPOKE", "SPORT", "STAFF", "STAGE", "STAKE", "STAND", "START",
            "STATE", "STEAM", "STEEL", "STICK", "STILL", "STOCK", "STONE", "STOOD", "STORE", "STORM",
            "STORY", "STRIP", "STUDY", "STYLE", "SUGAR", "SUITE", "SUPER", "SWEET", "TABLE", "TAKEN",
            "TASTE", "TAXES", "TEACH", "TEETH", "TEXAS", "THANK", "THEFT", "THEIR", "THEME", "THERE",
            "THESE", "THICK", "THING", "THINK", "THIRD", "THOSE", "THREE", "THREW", "THROW", "TIGHT",
            "TIMES", "TIRED", "TITLE", "TODAY", "TOPIC", "TOTAL", "TOUCH", "TOUGH", "TOWER", "TRACK",
            "TRADE", "TRAIN", "TREAT", "TREND", "TRIAL", "TRIED", "TRIES", "TRUCK", "TRULY", "TRUST",
            "TRUTH", "TWICE", "UNDER", "UNDUE", "UNION", "UNITY", "UNTIL", "UPPER", "UPSET", "URBAN",
            "USAGE", "USUAL", "VALID", "VALUE", "VIDEO", "VIRUS", "VISIT", "VITAL", "VOICE", "WASTE",
            "WATCH", "WATER", "WHEEL", "WHERE", "WHICH", "WHILE", "WHITE", "WHOLE", "WHOSE", "WOMAN",
            "WOMEN", "WORLD", "WORRY", "WORSE", "WORST", "WORTH", "WOULD", "WOUND", "WRITE", "WRONG",
            "YIELD", "YOUNG", "YOUTH"
        ]);

        const WORD_LEN = 5;
        const MAX_GUESSES = 6;

        let targetWord = "";
        let currentGuess = "";
        let currentRow = 0;
        let isGameOver = false;

        const boardEl = document.getElementById('board');
        const toastEl = document.getElementById('toast');
        const modalEl = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), 1500);
        }

        function createBoardUI() {
            boardEl.innerHTML = '';
            for (let r = 0; r < MAX_GUESSES; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                row.dataset.row = r;
                for (let c = 0; c < WORD_LEN; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.col = c;
                    row.appendChild(tile);
                }
                boardEl.appendChild(row);
            }
        }

        function startNewGame() {
            modalEl.classList.remove('visible');
            targetWord = TARGET_WORDS[Math.floor(Math.random() * TARGET_WORDS.length)];
            currentGuess = "";
            currentRow = 0;
            isGameOver = false;

            createBoardUI();

            // Reset keys
            document.querySelectorAll('.key').forEach(k => {
                k.classList.remove('correct', 'present', 'absent');
            });
        }

        function handleLetter(char) {
            if (isGameOver || currentGuess.length >= WORD_LEN) return;
            currentGuess += char;
            Sound.key();

            const row = boardEl.children[currentRow];
            const tile = row.children[currentGuess.length - 1];
            tile.textContent = char;
            tile.classList.add('pop');
            setTimeout(() => tile.classList.remove('pop'), 120);
        }

        function handleDelete() {
            if (isGameOver || currentGuess.length === 0) return;
            const row = boardEl.children[currentRow];
            const tile = row.children[currentGuess.length - 1];
            tile.textContent = "";
            currentGuess = currentGuess.slice(0, -1);
            Sound.del();
        }

        function handleEnter() {
            if (isGameOver) return;
            const row = boardEl.children[currentRow];

            if (currentGuess.length < WORD_LEN) {
                showToast("Not enough letters");
                Sound.error();
                row.classList.remove('shake');
                void row.offsetWidth;
                row.classList.add('shake');
                return;
            }

            if (!VALID_WORDS.has(currentGuess)) {
                showToast("Not in word list");
                Sound.error();
                row.classList.remove('shake');
                void row.offsetWidth;
                row.classList.add('shake');
                return;
            }

            // Evaluate Guess
            const guessLetters = currentGuess.split('');
            const targetLetters = targetWord.split('');
            const result = Array(WORD_LEN).fill('absent');

            // Pass 1: Correct letters in correct spots
            for (let i = 0; i < WORD_LEN; i++) {
                if (guessLetters[i] === targetLetters[i]) {
                    result[i] = 'correct';
                    targetLetters[i] = null;
                }
            }

            // Pass 2: Present letters in wrong spots
            for (let i = 0; i < WORD_LEN; i++) {
                if (result[i] !== 'correct') {
                    const foundIndex = targetLetters.indexOf(guessLetters[i]);
                    if (foundIndex !== -1) {
                        result[i] = 'present';
                        targetLetters[foundIndex] = null;
                    }
                }
            }

            // Apply Classes & Sounds with flip animation
            for (let i = 0; i < WORD_LEN; i++) {
                const tile = row.children[i];
                const letter = guessLetters[i];
                const res = result[i];

                setTimeout(() => {
                    tile.classList.add('flip');
                    Sound.flip(i);
                    setTimeout(() => {
                        tile.classList.add(res);
                    }, 250);

                    // Update keyboard
                    const keyEl = document.querySelector(`.key[data-key="${letter}"]`);
                    if (keyEl) {
                        if (res === 'correct') {
                            keyEl.classList.remove('present', 'absent');
                            keyEl.classList.add('correct');
                        } else if (res === 'present' && !keyEl.classList.contains('correct')) {
                            keyEl.classList.add('present');
                        } else if (res === 'absent' && !keyEl.classList.contains('correct') && !keyEl.classList.contains('present')) {
                            keyEl.classList.add('absent');
                        }
                    }
                }, i * 180);
            }

            // Check Win / Lose after animations
            setTimeout(() => {
                if (currentGuess === targetWord) {
                    handleWin();
                } else if (currentRow === MAX_GUESSES - 1) {
                    handleLoss();
                } else {
                    currentRow++;
                    currentGuess = "";
                }
            }, WORD_LEN * 180 + 350);
        }

        function updateStats(won) {
            let played = parseInt(localStorage.getItem('wordle_played') || '0') + 1;
            let wins = parseInt(localStorage.getItem('wordle_wins') || '0') + (won ? 1 : 0);
            let streak = won ? (parseInt(localStorage.getItem('wordle_streak') || '0') + 1) : 0;
            let maxStreak = Math.max(streak, parseInt(localStorage.getItem('wordle_maxstreak') || '0'));

            localStorage.setItem('wordle_played', played);
            localStorage.setItem('wordle_wins', wins);
            localStorage.setItem('wordle_streak', streak);
            localStorage.setItem('wordle_maxstreak', maxStreak);

            document.getElementById('stat-played').textContent = played;
            document.getElementById('stat-winpct').textContent = Math.round((wins / played) * 100) + '%';
            document.getElementById('stat-streak').textContent = streak;
            document.getElementById('stat-maxstreak').textContent = maxStreak;
        }

        function handleWin() {
            isGameOver = true;
            Sound.win();
            updateStats(true);

            // Staggered winning bounce on tiles
            const row = boardEl.children[currentRow];
            for (let i = 0; i < WORD_LEN; i++) {
                setTimeout(() => {
                    row.children[i].classList.add('win');
                }, i * 100);
            }

            modalTitle.textContent = "CIPHER CRACKED";
            modalTitle.style.color = "#10b981";
            modalDesc.textContent = `Target word "${targetWord}" solved in ${currentRow + 1} guesses!`;
            setTimeout(() => modalEl.classList.add('visible'), 1000);
        }

        function handleLoss() {
            isGameOver = true;
            Sound.error();
            updateStats(false);
            modalTitle.textContent = "SYSTEM LOCKED";
            modalTitle.style.color = "#f43f5e";
            modalDesc.textContent = `The decrypted word was "${targetWord}".`;
            setTimeout(() => modalEl.classList.add('visible'), 700);
        }

        // Keyboard inputs
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleEnter();
            } else if (e.key === 'Backspace') {
                handleDelete();
            } else {
                const char = e.key.toUpperCase();
                if (/^[A-Z]$/.test(char)) {
                    handleLetter(char);
                }
            }
        });

        // Virtual keyboard buttons
        document.querySelectorAll('.key').forEach(btn => {
            btn.addEventListener('click', () => {
                const k = btn.dataset.key;
                if (k === 'ENTER') handleEnter();
                else if (k === 'BACKSPACE') handleDelete();
                else handleLetter(k);
            });
        });

        startNewGame();
    </script>
</body>
</html>
