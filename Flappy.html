<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Flappy Jet — GokuGames</title>
    <style>
        :root {
            --bg-base: #060913;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 60%),
                linear-gradient(to bottom, #060913, #02040a);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Top Hub Bar */
        .hub-bar {
            width: 100%;
            height: 52px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .hub-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .hub-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-hub {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--text-main);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-hub:hover {
            background: #0284c7;
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        /* Main Game Layout */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: min(calc(100vh - 100px), 640px);
            background: #020617;
            border: 2px solid rgba(56, 189, 248, 0.35);
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.7), 0 0 35px rgba(56, 189, 248, 0.15);
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(6, 9, 19, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 50;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            margin-bottom: 10px;
        }

        .overlay p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
            max-width: 320px;
        }

        .btn-boost {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #040711;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 14px 40px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transition: transform 0.15s;
        }

        .btn-boost:hover {
            transform: scale(1.05);
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="hub-bar">
        <div class="hub-title">
            <svg class="icon-svg" style="stroke: #38bdf8; fill: none; stroke-width: 2;" viewBox="0 0 24 24">
                <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
            </svg>
            <span>CYBER FLAPPY JET</span>
        </div>
        <div class="hub-actions">
            <button class="btn-hub" id="btn-sound" title="Toggle Audio">
                <svg class="icon-svg" id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="toggleHubFullscreen()" title="Fullscreen">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="returnToHub()" title="Return to Arcade Hub">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>HUB</span>
            </button>
        </div>
    </header>

    <!-- Game Arena -->
    <main class="game-layout">
        <div class="canvas-container" id="canvas-wrapper">
            <canvas id="flappy-canvas"></canvas>
            
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">CYBER JET</h2>
                <p id="overlay-desc">Tap screen or Spacebar to fire pulse thrusters through neon defense gates.</p>
                <button class="btn-boost" id="btn-start" onclick="startGame()">ENGAGE THRUST</button>
            </div>
        </div>
    </main>

    <script>
        /* Hub Navigation Protocol */
        function returnToHub() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeGame' }, '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        function toggleHubFullscreen() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'toggleFullscreen' }, '*');
            } else {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        /* Procedural Web Audio Engine */
        const Sound = (() => {
            let ctx = null;
            let enabled = true;

            const init = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
            };

            const tone = (freq, duration, type = 'sine', vol = 0.1) => {
                if (!enabled) return;
                init();
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            return {
                toggle: () => {
                    enabled = !enabled;
                    return enabled;
                },
                flap: () => tone(440, 0.08, 'triangle', 0.15),
                score: () => {
                    tone(600, 0.08, 'sine', 0.15);
                    setTimeout(() => tone(900, 0.12, 'sine', 0.15), 60);
                },
                hit: () => {
                    tone(180, 0.15, 'sawtooth', 0.25);
                    setTimeout(() => tone(90, 0.3, 'square', 0.3), 100);
                }
            };
        })();

        document.getElementById('btn-sound').addEventListener('click', () => {
            const active = Sound.toggle();
            const icon = document.getElementById('sound-icon');
            if (active) {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            }
        });

        /* Game Mechanics */
        const canvas = document.getElementById('flappy-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-wrapper');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const btnStart = document.getElementById('btn-start');

        let isRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_high_score') || '0');
        let screenShake = 0;

        function resizeGame() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resizeGame);

        // Drone / Jet
        const drone = {
            x: 100,
            y: 250,
            radius: 16,
            vy: 0,
            gravity: 0.38,
            jump: -7.0,
            angle: 0
        };

        // Obstacles (Laser Gates)
        let gates = [];
        let gateTimer = 0;
        const GATE_GAP = 160;
        const GATE_WIDTH = 54;
        const GATE_SPEED = 2.8;

        // Background Cyber Skyline buildings
        let buildings = [];
        for (let i = 0; i < 15; i++) {
            buildings.push({
                x: i * 80,
                w: 60 + Math.random() * 40,
                h: 100 + Math.random() * 200,
                color: Math.random() > 0.5 ? '#090e1f' : '#0c1328'
            });
        }

        let particles = [];

        function createGate() {
            const h = container.clientHeight || 500;
            const minH = 70;
            const maxH = h - GATE_GAP - minH;
            const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
            gates.push({
                x: container.clientWidth || 800,
                top: topH,
                bottom: topH + GATE_GAP,
                passed: false
            });
        }

        function flap() {
            if (!isRunning) return;
            drone.vy = drone.jump;
            Sound.flap();

            // Particle exhaust
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: drone.x - 16,
                    y: drone.y + (Math.random() * 8 - 4),
                    vx: -(Math.random() * 4 + 3),
                    vy: (Math.random() * 4 - 2),
                    life: 1.0,
                    color: Math.random() > 0.4 ? '#38bdf8' : '#f59e0b'
                });
            }
        }

        function update() {
            if (!isRunning) return;

            const h = container.clientHeight || 500;
            const w = container.clientWidth || 800;

            // Physics
            drone.vy += drone.gravity;
            drone.y += drone.vy;
            drone.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, (drone.vy / 10)));

            // Bounds
            if (drone.y + drone.radius >= h - 10) {
                drone.y = h - 10 - drone.radius;
                gameOver();
                return;
            }
            if (drone.y - drone.radius <= 0) {
                drone.y = drone.radius;
                drone.vy = 0;
            }

            // Move Skyline
            buildings.forEach(b => {
                b.x -= 0.6;
                if (b.x + b.w < 0) b.x = w + 40;
            });

            // Gates
            gateTimer++;
            if (gateTimer > 110) {
                gateTimer = 0;
                createGate();
            }

            for (let i = gates.length - 1; i >= 0; i--) {
                const g = gates[i];
                g.x -= GATE_SPEED;

                // Score check
                if (!g.passed && g.x + GATE_WIDTH < drone.x) {
                    g.passed = true;
                    score++;
                    Sound.score();
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('flappy_high_score', highScore);
                    }
                }

                // Collision detection
                if (drone.x + drone.radius > g.x && drone.x - drone.radius < g.x + GATE_WIDTH) {
                    if (drone.y - drone.radius < g.top || drone.y + drone.radius > g.bottom) {
                        screenShake = 15;
                        gameOver();
                        return;
                    }
                }

                if (g.x + GATE_WIDTH < -30) {
                    gates.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) particles.splice(i, 1);
            }

            if (screenShake > 0) screenShake--;
        }

        function draw() {
            const w = container.clientWidth || 800;
            const h = container.clientHeight || 500;

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }

            ctx.clearRect(0, 0, w, h);

            // 1. Draw Parallax Skyline
            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, h - b.h, b.w, b.h);

                // Window lights
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                for (let wy = h - b.h + 20; wy < h - 20; wy += 28) {
                    for (let wx = b.x + 8; wx < b.x + b.w - 12; wx += 14) {
                        ctx.fillRect(wx, wy, 6, 12);
                    }
                }
            });

            // Grid Floor
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, h - 8);
            ctx.lineTo(w, h - 8);
            ctx.stroke();

            // 2. Draw Gates
            gates.forEach(g => {
                // Top Gate Conduit
                ctx.fillStyle = '#0a0f1d';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2;
                ctx.fillRect(g.x, 0, GATE_WIDTH, g.top);
                ctx.strokeRect(g.x, 0, GATE_WIDTH, g.top);

                // Top Emitter Cap
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.fillRect(g.x - 4, g.top - 16, GATE_WIDTH + 8, 16);
                ctx.shadowBlur = 0;

                // Bottom Gate Conduit
                ctx.fillStyle = '#0a0f1d';
                ctx.fillRect(g.x, g.bottom, GATE_WIDTH, h - g.bottom);
                ctx.strokeRect(g.x, g.bottom, GATE_WIDTH, h - g.bottom);

                // Bottom Emitter Cap
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.fillRect(g.x - 4, g.bottom, GATE_WIDTH + 8, 16);
                ctx.shadowBlur = 0;

                // Electric Laser Arc inside gap
                const arcGlow = Math.sin(performance.now() / 100) * 0.1 + 0.2;
                ctx.strokeStyle = `rgba(56, 189, 248, ${arcGlow})`;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(g.x + GATE_WIDTH / 2, g.top);
                ctx.lineTo(g.x + GATE_WIDTH / 2, g.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
            });

            // 3. Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.5 * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // 4. Draw Drone
            ctx.save();
            ctx.translate(drone.x, drone.y);
            ctx.rotate(drone.angle);

            // Plasma Thruster Flame
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(-16, 0);
            ctx.lineTo(-26, -7);
            ctx.lineTo(-32, 0);
            ctx.lineTo(-26, 7);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // Main Hull
            ctx.fillStyle = '#0284c7';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(18, 0);
            ctx.lineTo(-14, -12);
            ctx.lineTo(-8, 0);
            ctx.lineTo(-14, 12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Cockpit Dome
            ctx.fillStyle = '#f8fafc';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(2, 0, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();

            // 5. Score HUD
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.shadowBlur = 8;
            ctx.fillText(score, w / 2, 70);
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            overlay.classList.remove('visible');
            const h = container.clientHeight || 500;
            drone.y = h / 2;
            drone.vy = 0;
            drone.angle = 0;
            gates = [];
            particles = [];
            gateTimer = 0;
            score = 0;
            screenShake = 0;
            isRunning = true;
            resizeGame();
            flap();
        }

        function gameOver() {
            isRunning = false;
            Sound.hit();
            overlayTitle.textContent = "HULL BREACHED";
            overlayTitle.style.color = "#f43f5e";
            overlayDesc.textContent = `Score: ${score} | High Score: ${highScore}`;
            btnStart.textContent = "RELAUNCH JET";
            overlay.classList.add('visible');
        }

        // Input
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!isRunning) startGame();
                else flap();
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isRunning) startGame();
            else flap();
        });

        resizeGame();
        overlay.classList.add('visible');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
