<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Flappy Jet — GokuGames</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #131b2e;
            --border: #2a374f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* Top Hub Bar */
        .hub-bar {
            width: 100%;
            height: 48px;
            background: rgba(19, 27, 46, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .hub-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-cyan);
        }

        .hub-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-hub {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }

        .btn-hub:hover {
            background: #2a374f;
            border-color: var(--accent-cyan);
            color: #fff;
        }

        /* Main Game Layout */
        .game-layout {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            width: 100%;
            max-width: 440px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 14;
            background: #020617;
            border: 2px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 50;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }

        .overlay p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-boost {
            background: var(--accent-cyan);
            color: #0b0f19;
            font-size: 15px;
            font-weight: 800;
            padding: 12px 32px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
        }

        .btn-boost:hover {
            transform: scale(1.05);
        }

        .icon-svg {
            width: 16px;
            height: 16px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="hub-bar">
        <div class="hub-title">
            <svg class="icon-svg" style="stroke: #38bdf8; fill: none; stroke-width: 2;" viewBox="0 0 24 24">
                <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
            </svg>
            <span>CYBER FLAPPY JET</span>
        </div>
        <div class="hub-actions">
            <button class="btn-hub" id="btn-sound" title="Toggle Audio">
                <svg class="icon-svg" id="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="toggleHubFullscreen()" title="Fullscreen">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
            <button class="btn-hub" onclick="returnToHub()" title="Return to Arcade Hub">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>HUB</span>
            </button>
        </div>
    </header>

    <!-- Game Arena -->
    <main class="game-layout">
        <div class="canvas-container">
            <canvas id="flappy-canvas" width="360" height="560"></canvas>
            
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">CYBER JET</h2>
                <p id="overlay-desc">Tap screen or press Spacebar to engage thrusters.</p>
                <button class="btn-boost" id="btn-start" onclick="startGame()">ENGAGE</button>
            </div>
        </div>
    </main>

    <script>
        /* Hub Navigation Protocol */
        function returnToHub() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'closeGame' }, '*');
            } else {
                window.location.href = 'index.html';
            }
        }

        function toggleHubFullscreen() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'toggleFullscreen' }, '*');
            } else {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        /* Procedural Web Audio Engine */
        const Sound = (() => {
            let ctx = null;
            let enabled = true;

            const init = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
            };

            const tone = (freq, duration, type = 'sine', vol = 0.1) => {
                if (!enabled) return;
                init();
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(vol, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            return {
                toggle: () => {
                    enabled = !enabled;
                    return enabled;
                },
                flap: () => tone(420, 0.08, 'triangle', 0.15),
                score: () => {
                    tone(600, 0.08, 'sine', 0.15);
                    setTimeout(() => tone(900, 0.12, 'sine', 0.15), 60);
                },
                hit: () => {
                    tone(180, 0.15, 'sawtooth', 0.25);
                    setTimeout(() => tone(90, 0.3, 'square', 0.3), 100);
                }
            };
        })();

        document.getElementById('btn-sound').addEventListener('click', () => {
            const active = Sound.toggle();
            const icon = document.getElementById('sound-icon');
            if (active) {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
            } else {
                icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
            }
        });

        /* Game Mechanics */
        const canvas = document.getElementById('flappy-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const btnStart = document.getElementById('btn-start');

        let isRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_high_score') || '0');

        // Drone / Jet
        const drone = {
            x: 70,
            y: 250,
            radius: 14,
            vy: 0,
            gravity: 0.38,
            jump: -6.8,
            angle: 0
        };

        // Obstacles (Laser Gates)
        let gates = [];
        let gateTimer = 0;
        const GATE_GAP = 135;
        const GATE_WIDTH = 48;
        const GATE_SPEED = 2.4;

        // Particle Exhaust
        let particles = [];

        function createGate() {
            const minH = 60;
            const maxH = canvas.height - GATE_GAP - minH;
            const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
            gates.push({
                x: canvas.width,
                top: topH,
                bottom: topH + GATE_GAP,
                passed: false
            });
        }

        function flap() {
            if (!isRunning) return;
            drone.vy = drone.jump;
            Sound.flap();

            // Emit particle burst
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: drone.x - 12,
                    y: drone.y + (Math.random() * 8 - 4),
                    vx: -(Math.random() * 3 + 2),
                    vy: (Math.random() * 4 - 2),
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#38bdf8' : '#f59e0b'
                });
            }
        }

        function update() {
            if (!isRunning) return;

            // Physics
            drone.vy += drone.gravity;
            drone.y += drone.vy;

            // Calculate rotation angle
            drone.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, (drone.vy / 10)));

            // Floor & Ceiling bounds
            if (drone.y + drone.radius >= canvas.height - 10) {
                drone.y = canvas.height - 10 - drone.radius;
                gameOver();
                return;
            }
            if (drone.y - drone.radius <= 0) {
                drone.y = drone.radius;
                drone.vy = 0;
            }

            // Gates
            gateTimer++;
            if (gateTimer > 95) {
                gateTimer = 0;
                createGate();
            }

            for (let i = gates.length - 1; i >= 0; i--) {
                const g = gates[i];
                g.x -= GATE_SPEED;

                // Score check
                if (!g.passed && g.x + GATE_WIDTH < drone.x) {
                    g.passed = true;
                    score++;
                    Sound.score();
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('flappy_high_score', highScore);
                    }
                }

                // Collision detection
                if (drone.x + drone.radius > g.x && drone.x - drone.radius < g.x + GATE_WIDTH) {
                    if (drone.y - drone.radius < g.top || drone.y + drone.radius > g.bottom) {
                        gameOver();
                        return;
                    }
                }

                // Remove offscreen
                if (g.x + GATE_WIDTH < -20) {
                    gates.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background cyber grid lines
            ctx.strokeStyle = 'rgba(30, 58, 138, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 30) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 30) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw Gates
            gates.forEach(g => {
                // Top Gate
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.fillRect(g.x, 0, GATE_WIDTH, g.top);
                ctx.strokeRect(g.x, 0, GATE_WIDTH, g.top);

                // Top Gate Emitter Bar
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillRect(g.x - 4, g.top - 12, GATE_WIDTH + 8, 12);
                ctx.shadowBlur = 0;

                // Bottom Gate
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(g.x, g.bottom, GATE_WIDTH, canvas.height - g.bottom);
                ctx.strokeRect(g.x, g.bottom, GATE_WIDTH, canvas.height - g.bottom);

                // Bottom Gate Emitter Bar
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.fillRect(g.x - 4, g.bottom, GATE_WIDTH + 8, 12);
                ctx.shadowBlur = 0;

                // Laser Beam Preview inside gap
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(g.x + GATE_WIDTH / 2, g.top);
                ctx.lineTo(g.x + GATE_WIDTH / 2, g.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Drone
            ctx.save();
            ctx.translate(drone.x, drone.y);
            ctx.rotate(drone.angle);

            // Thruster Glow
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(-12, 0);
            ctx.lineTo(-20, -5);
            ctx.lineTo(-24, 0);
            ctx.lineTo(-20, 5);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // Chassis
            ctx.fillStyle = '#0284c7';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(14, 0);
            ctx.lineTo(-10, -10);
            ctx.lineTo(-6, 0);
            ctx.lineTo(-10, 10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Cockpit Canopy
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(2, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw Score HUD
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 36px monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 6;
            ctx.fillText(score, canvas.width / 2, 60);
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            overlay.classList.remove('visible');
            drone.y = 250;
            drone.vy = 0;
            drone.angle = 0;
            gates = [];
            particles = [];
            gateTimer = 0;
            score = 0;
            isRunning = true;
            flap();
        }

        function gameOver() {
            isRunning = false;
            Sound.hit();
            overlayTitle.textContent = "HULL BREACHED";
            overlayTitle.style.color = "#f43f5e";
            overlayDesc.textContent = `Gate Score: ${score} | Record: ${highScore}`;
            btnStart.textContent = "RELAUNCH JET";
            overlay.classList.add('visible');
        }

        // Input
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (!isRunning) startGame();
                else flap();
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isRunning) startGame();
            else flap();
        });

        overlay.classList.add('visible');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
