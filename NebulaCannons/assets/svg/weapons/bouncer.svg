<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- trajectory arc -->
  <path d="M4.5 4.5 Q13 19 23.5 12.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="1 4" stroke-opacity="0.6"/>
  <!-- ball -->
  <circle cx="24" cy="11.5" r="3.4" fill="currentColor" fill-opacity="0.16"/>
  <circle cx="24" cy="11.5" r="3.4" stroke="currentColor" stroke-width="1.9"/>
  <circle cx="23" cy="10.6" r="1.1" fill="currentColor"/>
  <!-- bounce squash mark -->
  <path d="M18.5 20.5 Q21 18.8 23.5 20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- impact stars -->
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
    <line x1="19.5" y1="24" x2="21.5" y2="23.4"/>
    <line x1="25.5" y1="24.5" x2="25.2" y2="22.4"/>
  </g>
</svg>
