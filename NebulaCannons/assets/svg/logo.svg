<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96">
  <defs>
    <linearGradient id="lg-barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9df3ff"/>
      <stop offset="1" stop-color="#3ef2ff"/>
    </linearGradient>
    <linearGradient id="lg-core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <radialGradient id="rg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff8a3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow behind the emblem -->
  <circle cx="60" cy="48" r="34" fill="url(#rg-glow)"/>

  <!-- outer ring -->
  <circle cx="60" cy="48" r="30" fill="none" stroke="#3ef2ff" stroke-opacity="0.28" stroke-width="1.6"/>
  <circle cx="60" cy="48" r="26.5" fill="none" stroke="#3ef2ff" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- crossed cannons -->
  <g stroke="url(#lg-barrel)" stroke-width="7" stroke-linecap="round">
    <line x1="36" y1="62" x2="86" y2="36"/>
    <line x1="86" y1="62" x2="36" y2="36"/>
  </g>
  <g stroke="#0b2a33" stroke-width="2" stroke-linecap="round">
    <line x1="36" y1="62" x2="86" y2="36"/>
    <line x1="86" y1="62" x2="36" y2="36"/>
  </g>

  <!-- barrel breeches -->
  <circle cx="46" cy="55" r="6.5" fill="#0e2230" stroke="#3ef2ff" stroke-width="1.8"/>
  <circle cx="74" cy="41" r="6.5" fill="#0e2230" stroke="#3ef2ff" stroke-width="1.8"/>

  <!-- central star -->
  <path d="M60 26l3.4 8.6L72 38l-8.6 3.4L60 50l-3.4-8.6L48 38l8.6-3.4z" fill="url(#lg-core)" stroke="#fff6d8" stroke-width="0.8"/>
  <circle cx="60" cy="38" r="3" fill="#fffbe6"/>

  <!-- sparks -->
  <g stroke="#ffe14d" stroke-width="1.6" stroke-linecap="round">
    <line x1="60" y1="12" x2="60" y2="20"/>
    <line x1="60" y1="56" x2="60" y2="64"/>
    <line x1="34" y1="38" x2="41" y2="38"/>
    <line x1="79" y1="38" x2="86" y2="38"/>
  </g>
  <g fill="#9df3ff">
    <circle cx="52" cy="16" r="1.6"/>
    <circle cx="72" cy="14" r="1.1"/>
    <circle cx="40" cy="30" r="1.2"/>
    <circle cx="82" cy="52" r="1.4"/>
    <circle cx="44" cy="70" r="1.2"/>
  </g>

  <!-- star-trail text-side decoration -->
  <g stroke="#3ef2ff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
    <path d="M118 34h52" stroke-dasharray="2 7"/>
    <path d="M118 62h38" stroke-dasharray="2 7"/>
  </g>
  <path d="M118 48l4 4-4 4-4-4z" fill="#ffe14d"/>
  <g fill="#9df3ff" fill-opacity="0.7">
    <circle cx="132" cy="42" r="1"/>
    <circle cx="150" cy="56" r="1.1"/>
    <circle cx="170" cy="40" r="0.9"/>
    <circle cx="188" cy="52" r="1"/>
    <circle cx="206" cy="44" r="1.2"/>
    <circle cx="224" cy="58" r="0.9"/>
    <circle cx="242" cy="42" r="1.1"/>
    <circle cx="260" cy="55" r="1"/>
    <circle cx="278" cy="45" r="1.2"/>
  </g>
</svg>
