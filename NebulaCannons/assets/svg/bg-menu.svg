<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.45" stop-color="#0a0e26"/>
      <stop offset="0.75" stop-color="#141a3f"/>
      <stop offset="1" stop-color="#0d1230"/>
    </linearGradient>
    <radialGradient id="nb-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ef2ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3ef2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nb-magenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c14dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c14dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nb-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nb-gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#7fd4ff"/>
      <stop offset="0.55" stop-color="#2a5cff"/>
      <stop offset="1" stop-color="#0c1e5e"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#0a0e22"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-sky)"/>

  <!-- nebula clouds -->
  <ellipse cx="420" cy="260" rx="560" ry="300" fill="url(#nb-cyan)"/>
  <ellipse cx="1500" cy="330" rx="620" ry="340" fill="url(#nb-magenta)"/>
  <ellipse cx="980" cy="720" rx="700" ry="360" fill="url(#nb-blue)"/>
  <ellipse cx="220" cy="760" rx="420" ry="260" fill="url(#nb-magenta)"/>
  <ellipse cx="1750" cy="760" rx="380" ry="240" fill="url(#nb-cyan)"/>
  <ellipse cx="960" cy="160" rx="500" ry="220" fill="url(#nb-gold)"/>

  <!-- star field -->
  <g fill="#dbe6ff">
    <circle cx="120" cy="90" r="1.4"/>
    <circle cx="340" cy="180" r="1"/>
    <circle cx="560" cy="70" r="1.8"/>
    <circle cx="740" cy="210" r="1"/>
    <circle cx="920" cy="90" r="1.3"/>
    <circle cx="1120" cy="200" r="1.6"/>
    <circle cx="1300" cy="80" r="1"/>
    <circle cx="1500" cy="190" r="1.7"/>
    <circle cx="1720" cy="70" r="1.1"/>
    <circle cx="1880" cy="240" r="1.5"/>
    <circle cx="240" cy="360" r="1.1"/>
    <circle cx="480" cy="420" r="1.4"/>
    <circle cx="640" cy="330" r="0.9"/>
    <circle cx="860" cy="460" r="1.2"/>
    <circle cx="1040" cy="340" r="1"/>
    <circle cx="1260" cy="430" r="1.5"/>
    <circle cx="1420" cy="320" r="1"/>
    <circle cx="1640" cy="470" r="1.3"/>
    <circle cx="1820" cy="360" r="1"/>
    <circle cx="300" cy="560" r="1.3"/>
    <circle cx="700" cy="600" r="1"/>
    <circle cx="1180" cy="580" r="1.2"/>
    <circle cx="1560" cy="560" r="1.1"/>
  </g>
  <g fill="#9df3ff" fill-opacity="0.8">
    <circle cx="200" cy="140" r="0.8"/>
    <circle cx="1020" cy="140" r="0.9"/>
    <circle cx="1600" cy="120" r="0.8"/>
    <circle cx="600" cy="520" r="0.9"/>
    <circle cx="1400" cy="520" r="0.8"/>
  </g>

  <!-- sparkle stars -->
  <g stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M560 70v-6M560 70v6M557 70h-6M563 70h6" />
    <path d="M1500 190v-5M1500 190v5M1497 190h-5M1503 190h5" />
    <path d="M1120 200v-4M1120 200v4M1117 200h-4M1123 200h4" />
  </g>

  <!-- ringed planet -->
  <g opacity="0.9">
    <ellipse cx="1630" cy="270" rx="150" ry="34" fill="none" stroke="#9df3ff" stroke-opacity="0.35" stroke-width="6" transform="rotate(-18 1630 270)"/>
    <ellipse cx="1630" cy="270" rx="170" ry="40" fill="none" stroke="#9df3ff" stroke-opacity="0.18" stroke-width="3" transform="rotate(-18 1630 270)"/>
    <circle cx="1630" cy="270" r="58" fill="url(#planet)"/>
    <path d="M1590 240 q30 28 70 8" stroke="#9df3ff" stroke-opacity="0.5" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M1600 300 q34 -30 66 -12" stroke="#9df3ff" stroke-opacity="0.3" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- distant moon -->
  <circle cx="300" cy="230" r="16" fill="#d7e2ff" fill-opacity="0.14"/>
  <circle cx="296" cy="226" r="4" fill="#d7e2ff" fill-opacity="0.1"/>

  <!-- horizon silhouette -->
  <path d="M0 950 L140 900 L300 940 L470 880 L640 930 L820 870 L980 930 L1140 885 L1320 935 L1500 890 L1680 940 L1840 900 L1920 930 L1920 1080 L0 1080 Z" fill="url(#horizon)"/>
  <path d="M0 1010 L180 975 L360 1005 L560 965 L760 1008 L960 970 L1180 1005 L1380 968 L1580 1008 L1780 972 L1920 1005 L1920 1080 L0 1080 Z" fill="#070a1c"/>
</svg>
